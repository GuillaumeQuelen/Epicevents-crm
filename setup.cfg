[flake8]
max-line-length = 119
exclude = venv,.git,__pycache__

[tool:pytest]
testpaths = tests
pythonpath = . tests
filterwarnings =
    # SQLite stores Decimal amounts as floats; PostgreSQL (production) handles them natively.
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively

[coverage:run]
source = .
omit =
    venv/*
    tests/*
    init_db.py
    seed.py
    demo_sql_injection.py